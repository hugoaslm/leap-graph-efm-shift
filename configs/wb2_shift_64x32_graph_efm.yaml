dataset:
  name: wb2_era5_64x32
  fields_zarr: data/wb2_era5_64x32/fields.zarr
  forcing_zarr: data/wb2_era5_64x32/forcing.zarr
  static_dir: data/wb2_era5_64x32/static

grid:
  shape: [64, 32]

state_variables:
  - name: geopotential
    level: 500
    short_name: z500
  - name: temperature
    level: 850
    short_name: t850
  - name: 2m_temperature
    level: null
    short_name: t2m

forcing:
  num_features: 5
  window: 3

splits:
  train: ["1979-01-01", "2005-12-31"]
  val: ["2006-01-01", "2010-12-31"]
  id: ["2011-01-01", "2015-12-31"]
  ood: ["2016-01-01", "2022-12-31"]

sampling:
  step_length: 6
  eval_dates_per_month: 2

forecast:
  ar_steps_train_phase_a: 1
  ar_steps_train_phase_b: 4
  eval_leads: 12

graph:
  name: global_hierarchical_64x32
  splits: 3
  levels: 3
  hierarchical: true

model:
  name: graph_efm
  hidden_dim: 64
  latent_dim: 32
  hidden_layers: 1
  decoder_processor_layers: 2
  encoder_processor_layers: 1
  prior_processor_layers: 1
  kl_beta: 1.0
  crps_weight: 0
  loss: nll
  sample_obs_noise: false
  output_std: false
  prior_dist: isotropic
  learn_prior: true
  precision: bf16-mixed

training:
  phase_a:
    batch_size: 8
    epochs: 100
    lr: 1.0e-3
  phase_b:
    batch_size: 4
    epochs: 50
    lr: 5.0e-4

evaluation:
  ensemble_size: 8
  seed: 42
  bootstrap_resamples: 1000
  n_workers: 4

calibration:
  search_grid: [0.5, 0.75, 1.0, 1.25, 1.5, 2.0, 3.0, 5.0]
